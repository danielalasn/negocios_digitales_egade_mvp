<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin conexión – Buen Bocado</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1117;
      --fg: #f3f4f6;
      --muted: #9ca3af;
      --accent: #10b981;
      --card: #181b24;
      --border: #282d3d;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f9fafb;
        --fg: #111827;
        --muted: #6b7280;
        --accent: #059669;
        --card: #ffffff;
        --border: #e5e7eb;
      }
    }
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      border-radius: 20px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 8px;
      font-weight: 800;
    }
    p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      margin: 0 0 24px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 12px 20px;
      border-radius: 14px;
      background: var(--accent);
      color: #ffffff;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      box-sizing: border-box;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .tip {
      margin-top: 20px;
      font-size: 12px;
      color: var(--muted);
      background: rgba(0,0,0,0.03);
      padding: 10px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>Modo sin conexión</h1>
    <p>Parece que perdiste tu conexión a internet. Revisa tu señal o red Wi-Fi para seguir explorando paquetes en Monterrey.</p>
    <button class="btn" onclick="window.location.reload()">Reintentar conexión</button>
    <div class="tip">
      💡 Tus pedidos y códigos QR guardados previamente siguen disponibles en tu dispositivo.
    </div>
  </div>
</body>
</html>
